create_plan:
  name: Create plan
  description: Maak een laadplan met de lokale planner en optioneel AI.
  fields:
    mode:
      name: Mode
      required: false
      selector:
        select:
          options:
            - today
            - flex
            - deadline
    deadline:
      name: Deadline
      required: false
      selector:
        time: {}
    target_soc:
      name: Doelpercentage
      required: false
      selector:
        number:
          min: 50
          max: 100
          step: 5
          mode: box

simulate_plan:
  name: Simulate plan
  description: Bereken een plan zonder de laadpaal te bedienen of een sessie te starten.
  fields:
    mode:
      name: Mode
      required: false
      selector:
        select:
          options:
            - today
            - flex
            - deadline
    deadline:
      name: Deadline
      required: false
      selector:
        time: {}
    target_soc:
      name: Doelpercentage
      required: false
      selector:
        number:
          min: 50
          max: 100
          step: 5
          mode: box

test_flex:
  name: Test flexibel laadplan
  description: Bereken en toon een flexibel testplan zonder iets te schakelen.
  fields:
    target_soc:
      name: Testdoelpercentage
      required: false
      selector:
        number:
          min: 50
          max: 100
          step: 5
          mode: box

test_plan:
  name: Test laadplan
  description: Bereken en toon een testplan met de actuele tarieven zonder iets te schakelen.
  fields:
    target_soc:
      name: Testdoelpercentage
      required: false
      selector:
        number:
          min: 50
          max: 100
          step: 5
          mode: box

update_setup:
  name: Update setup
  description: Sla de wizardkeuzes voor sensoren en besturing op.
  fields:
    soc_entity:
      name: Auto SoC
      required: false
      selector:
        entity:
          domain: sensor
    plug_entity:
      name: Auto aangesloten
      required: false
      selector:
        entity:
          domain:
            - sensor
            - binary_sensor
    charging_entity:
      name: Auto laadstatus
      required: false
      selector:
        entity:
          domain:
            - sensor
            - binary_sensor
    charger_state_entity:
      name: Peblar/laadpaalstatus
      required: false
      selector:
        entity:
          domain:
            - sensor
            - binary_sensor
    charger_switch_entity:
      name: Laadpaal aan/uit
      required: false
      selector:
        entity:
          domain: switch
    power_entity:
      name: Laadvermogen
      required: false
      selector:
        entity:
          domain: sensor
    session_energy_entity:
      name: Sessie-energie
      required: false
      selector:
        entity:
          domain: sensor
    tariff_entity:
      name: Tarief + forecast
      required: false
      selector:
        entity:
          domain: sensor
    solar_forecast_entity:
      name: Zonneforecast
      required: false
      selector:
        entity:
          domain: sensor
    solar_now_entity:
      name: Zonnevermogen nu
      required: false
      selector:
        entity:
          domain: sensor
    tariff_provider:
      name: Energieprovider
      required: false
      selector:
        select:
          options:
            - auto
            - zonneplan
            - tibber
            - anwb
            - generic
    control_mode:
      name: Besturingsmodus
      required: false
      selector:
        select:
          options:
            - monitor
            - hacs

test_connection:
  name: Test connections
  description: Controleer de gekoppelde sensoren en forecast zonder de laadpaal te schakelen.

start:
  name: Start charging
  description: Start laden na een lokale veiligheidscontrole.

stop:
  name: Stop charging
  description: Stop laden en sluit de actieve sessie af.

reset:
  name: Reset
  description: Wis het actieve plan zonder de laadpaal aan te zetten.

status:
  name: Refresh status
  description: Werk de EV-status bij.

telegram_test:
  name: Test Telegram
  description: Stuur het ingestelde testbericht naar de ingestelde Telegram-chat.

telegram_send:
  name: Stuur Telegrambericht
  description: Stuur een ingesteld Telegram-template of een eigen bericht.
  fields:
    event:
      name: Berichttype
      required: false
      selector:
        select:
          options:
            - test
            - plan
            - start
            - done
            - stop
            - blocked
    message:
      name: Eigen bericht
      description: Optioneel. Laat leeg om het ingestelde template te gebruiken.
      required: false
      selector:
        text:
