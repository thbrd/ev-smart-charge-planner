create_plan:
  name: Create plan
  description: Maak een laadplan met de lokale planner en optioneel AI.
  fields:
    mode:
      name: Mode
      required: false
      selector:
        select:
          options:
            - today
            - flex
            - deadline
    deadline:
      name: Deadline
      required: false
      selector:
        time: {}
    target_soc:
      name: Doelpercentage
      required: false
      selector:
        number:
          min: 50
          max: 100
          step: 5
          mode: box

simulate_plan:
  name: Simulate plan
  description: Bereken een plan zonder de laadpaal te bedienen of een sessie te starten.
  fields:
    mode:
      name: Mode
      required: false
      selector:
        select:
          options:
            - today
            - flex
            - deadline
    deadline:
      name: Deadline
      required: false
      selector:
        time: {}
    target_soc:
      name: Doelpercentage
      required: false
      selector:
        number:
          min: 50
          max: 100
          step: 5
          mode: box

test_flex:
  name: Test flexibel laadplan
  description: Bereken en toon een flexibel testplan zonder iets te schakelen.
  fields:
    target_soc:
      name: Testdoelpercentage
      required: false
      selector:
        number:
          min: 50
          max: 100
          step: 5
          mode: box

test_plan:
  name: Test laadplan
  description: Bereken en toon een testplan met de actuele tarieven zonder iets te schakelen.
  fields:
    target_soc:
      name: Testdoelpercentage
      required: false
      selector:
        number:
          min: 50
          max: 100
          step: 5
          mode: box

start:
  name: Start charging
  description: Start laden na een lokale veiligheidscontrole.

stop:
  name: Stop charging
  description: Stop laden en sluit de actieve sessie af.

reset:
  name: Reset
  description: Wis het actieve plan zonder de laadpaal aan te zetten.

status:
  name: Refresh status
  description: Werk de EV-status bij.

telegram_test:
  name: Test Telegram
  description: Stuur het ingestelde testbericht naar de ingestelde Telegram-chat.

telegram_send:
  name: Stuur Telegrambericht
  description: Stuur een ingesteld Telegram-template of een eigen bericht.
  fields:
    event:
      name: Berichttype
      required: false
      selector:
        select:
          options:
            - test
            - plan
            - start
            - done
            - stop
            - blocked
    message:
      name: Eigen bericht
      description: Optioneel. Laat leeg om het ingestelde template te gebruiken.
      required: false
      selector:
        text:
